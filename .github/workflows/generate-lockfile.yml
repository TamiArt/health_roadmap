name: Generate npm lockfile

on:
  push:
    branches:
      - feat/local-first-data-platform

permissions:
  contents: write

concurrency:
  group: lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check lockfile
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate lockfile with npm
        if: steps.lockfile.outputs.missing == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        if: steps.lockfile.outputs.missing == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): generate npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
